services:
  - type: web
    name: 7toseven-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "cd 7toSeven-main/backend && pip install -r requirements.txt"
    startCommand: "cd 7toSeven-main/backend && uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: "*"
